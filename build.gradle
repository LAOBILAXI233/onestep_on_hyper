// OneStep LSPosed 模块 - 单模块项目（根目录即模块）
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.5+ 对应 Android Studio Koala，兼容 Gradle 8.7+
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

android {
    namespace 'com.hyper.onestep'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hyper.onestep'
        // LSPosed 模块目标：Android 13+ / HyperOS
        minSdk 33
        targetSdk 36
        versionCode 3
        versionName "1.0.1.1-alpha"
    }

    sourceSets {
        main {
            // 复用原 AOSP 项目目录结构，不移动文件
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', 'src-lsp', 'src-stubs']
            java.exclude 'test/**'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            aidl.srcDirs = ['src']
            // libxposed/api 模块元数据：java_init.list + module.prop
            // 这些文件会被 AGP 当作 Java 资源打包进 APK
            resources.srcDirs = ['src-lsp/resources']

            // 暂时排除依赖 SmartisanOS 私有 SDK 且需要整体重写的文件
            // 1) setting/ 目录下所有 Activity 都依赖 smartisanos.widget.*
            // 2) SidebarApplication / SidebarService：LSP 模块不需要独立进程入口
            // 3) 钉钉/微信私有协议相关组件失效
            // 4) PendingDragEventTask / PackagesMonitor：依赖 SmartisanProgressDialog / AddContactManager
            // SidebarController 已重写为 LSP 版本，不再排除
            // 其余 view/util 文件通过兼容层（lsp 包下的 stub 类）保持原代码最小改动
            // 这些文件已物理移动到 src-excluded/ 目录，AGP 不会扫描
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 现代化 LSPosed API 102（io.github.libxposed:api）
    compileOnly 'io.github.libxposed:api:102.0.0'
    // AndroidX 兼容（原项目用了 android-support-v4，迁移到 AndroidX）
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
